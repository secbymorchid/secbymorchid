    <!-- Key Accolade Pill: CTF Champion -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="316" height="30" rx="6" fill="#19160d" stroke="#523e11" stroke-width="1"/>
      <text x="14" y="19" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">🏆 1st Place — Red Phoenix CTF 2026</text>
      <text x="238" y="19" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#d97706">6,750 pts</text>
    </g>

    <!-- Key Competencies Chips -->
    <g transform="translate(0, 188)">
      <rect x="0" y="0" width="112" height="24" rx="4" fill="#12141a" stroke="#23262e" stroke-width="1"/>
      <text x="56" y="16" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#aab0ba" text-anchor="middle">RGPD Recital 49</text>

      <rect x="120" y="0" width="102" height="24" rx="4" fill="#12141a" stroke="#23262e" stroke-width="1"/>
      <text x="171" y="16" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#aab0ba" text-anchor="middle">MITRE ATT&amp;CK</text>

