<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 308" width="830" height="308">
  <title>Moad Morchid — Profile Banner</title>
  <desc>Header banner with dark radial vignette, ambient starfield, cybersecurity student bio, and 3D isometric cyber and governance racks</desc>
  <defs>
    <radialGradient id="bannerVignette" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0c0f" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Background panel (inset 4px) -->
  <rect x="4" y="4" width="822" height="300" rx="12" fill="url(#bannerVignette)" stroke="#23262e" stroke-width="1"/>

  <!-- Starfield / Cyber Grid Dots -->
  <g id="starfield">
    <circle cx="790" cy="45" r="1" fill="#ffffff" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.08;0.35" dur="3.0s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="85" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="510" cy="40" r="1.1" fill="#3ddc84" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="140" r="0.7" fill="#ffffff" opacity="0.3"/>
    <circle cx="480" cy="120" r="0.9" fill="#f59e0b" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="50" r="0.7" fill="#ffffff" opacity="0.25"/>
    <circle cx="720" cy="240" r="1.2" fill="#ffffff" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="4.0s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="270" r="0.8" fill="#3ddc84" opacity="0.4"/>
    <circle cx="460" cy="260" r="1.0" fill="#ffffff" opacity="0.3"/>
    <circle cx="360" cy="30" r="0.7" fill="#ffffff" opacity="0.2"/>
    <circle cx="310" cy="275" r="0.8" fill="#ffffff" opacity="0.25"/>
