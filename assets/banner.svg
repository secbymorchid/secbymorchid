<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Radial ambient glow -->
    <radialGradient id="bannerGlow" cx="20%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#16233B" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#0E1524" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="1"/>
    </radialGradient>

    <!-- Linear gradient for cyber accent -->
    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Grid Fade Mask on the left side -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="0" width="560" height="320" fill="url(#gridFade)"/>
    </mask>

    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Canvas Fill -->
  <rect x="1" y="1" width="1198" height="318" rx="14" fill="url(#bannerGlow)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Perspective / Architectural Grid -->
  <g mask="url(#gridMask)">
    <rect x="0" y="0" width="560" height="320" fill="url(#archGrid)" />
    <!-- Diagonal perspective accent lines -->
    <line x1="0" y1="320" x2="480" y2="80" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="0" y1="260" x2="520" y2="140" stroke="#1E293B" stroke-width="0.8"/>
  </g>

  <!-- Right Side IS and GRC Schematic Node Matrix -->
  <g transform="translate(860, 40)" opacity="0.85">
    <!-- Connecting circuit / flow lines -->
    <path d="M 40 50 L 140 50 L 190 100 L 190 170 L 130 210 L 40 210" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 140 50 L 220 50 L 260 90 L 260 160 L 200 210" fill="none" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="140" y1="50" x2="140" y2="130" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="80" y1="130" x2="220" y2="130" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Central Governance Core Node -->
    <rect x="110" y="105" width="60" height="50" rx="8" fill="#161F30" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="140" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">GRC</text>
    <text x="140" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#94A3B8" text-anchor="middle">CORE</text>

    <!-- Satellite Nodes -->
    <circle cx="40" cy="50" r="14" fill="#161F30" stroke="#1E293B" stroke-width="1.5"/>
    <text x="40" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#38BDF8" text-anchor="middle">PM</text>

    <circle cx="220" cy="50" r="14" fill="#161F30" stroke="#1E293B" stroke-width="1.5"/>
    <text x="220" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#38BDF8" text-anchor="middle">SOC</text>

    <circle cx="260" cy="125" r="14" fill="#161F30" stroke="#1E293B" stroke-width="1.5"/>
    <text x="260" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#38BDF8" text-anchor="middle">TI</text>

    <circle cx="200" cy="210" r="14" fill="#161F30" stroke="#1E293B" stroke-width="1.5"/>
    <text x="200" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#38BDF8" text-anchor="middle">UML</text>

    <circle cx="40" cy="210" r="14" fill="#161F30" stroke="#1E293B" stroke-width="1.5"/>
    <text x="40" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#38BDF8" text-anchor="middle">SQL</text>

    <!-- Active status beacon -->
    <circle cx="140" cy="50" r="3.5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(64, 42)">
    <!-- Brand Tag -->
    <g transform="translate(0, 24)">
      <rect x="0" y="-16" width="144" height="24" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
      <circle cx="12" cy="-4" r="3" fill="#38BDF8"/>
      <text x="24" y="-1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="3px">// SECBYMORCHID</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="0.5px">MOAD MORCHID</text>

    <!-- Divider Line -->
    <line x1="0" y1="108" x2="720" y2="108" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="0" y1="108" x2="160" y2="108" stroke="url(#cyberAccent)" stroke-width="2"/>

    <!-- Primary Subtitle -->
    <text x="0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8" letter-spacing="1.2px">MGSI @ ENSAO  •  IT &amp; CYBER PROJECT MANAGEMENT  •  RISK &amp; GOVERNANCE</text>

    <!-- Secondary Focus Descriptor -->
    <text x="0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" fill="#64748B" letter-spacing="0.8px">IS URBANIZATION (MERISE / UML)  •  ISO 27001 / NIST  •  SECOPS &amp; THREAT TELEMETRY</text>
  </g>

  <!-- Bottom Right Contact / Verification Pills -->
  <g transform="translate(680, 248)">
    <!-- Pill 1: GitHub -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#38BDF8"/>
      <text x="28" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#94A3B8">github.com/secbymorchid</text>
    </g>

    <!-- Pill 2: Email -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#38BDF8"/>
      <text x="28" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#94A3B8">moad.morchid.cybersec@...</text>
    </g>
  </g>
</svg>