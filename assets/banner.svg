      <text x="273" y="16" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#aab0ba" text-anchor="middle">Agile / Scrum</text>

      <rect x="324" y="0" width="98" height="24" rx="4" fill="#12141a" stroke="#23262e" stroke-width="1"/>
      <text x="373" y="16" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#aab0ba" text-anchor="middle">Honeypot ETL</text>
    </g>
  </g>

