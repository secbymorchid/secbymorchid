    <circle cx="538" cy="170" r="1.6" fill="#3ddc84"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <rect x="494" y="181" width="52" height="13" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
    <circle cx="538" cy="187" r="1.6" fill="#8b909a" opacity="0.6"/>
    <rect x="494" y="198" width="52" height="13" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
    <circle cx="538" cy="204" r="1.6" fill="#3ddc84"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
