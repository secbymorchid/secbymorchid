    <rect x="593" y="171" width="54" height="15" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
    <circle cx="639" cy="178" r="1.8" fill="#8b909a" opacity="0.6"/>
    <rect x="593" y="190" width="54" height="15" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
