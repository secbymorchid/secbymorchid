    <rect x="696" y="181" width="52" height="13" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
    <circle cx="740" cy="187" r="1.6" fill="#8b909a" opacity="0.6"/>
    <rect x="696" y="198" width="52" height="13" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
    <circle cx="740" cy="204" r="1.6" fill="#38bdf8"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <rect x="696" y="215" width="52" height="13" rx="2" fill="#0f1115" stroke="#23262e" stroke-width="1"/>
    <circle cx="740" cy="221" r="1.6" fill="#8b909a" opacity="0.6"/>
