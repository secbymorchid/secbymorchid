    <!-- Academic Badge -->
    <rect x="0" y="0" width="186" height="24" rx="12" fill="#141822" stroke="#23262e" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#3ddc84"/>
    <text x="24" y="16" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#aab0ba" letter-spacing="0.5">MGSI @ ENSA OUJDA</text>

    <!-- Name & Handle -->
    <text x="0" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f2f4f7" letter-spacing="-0.5">Moad Morchid</text>
    <text x="216" y="63" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b909a">@secbymorchid</text>

    <!-- Subtitle: Track & Specialization -->
    <text x="0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#e6e8ec">
      IT &amp; Cyber Project Management · Information Systems Security
    </text>
    <text x="0" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b909a">
      Risk Analysis (EBIOS RM) · Governance &amp; Compliance (ISO 27001, RGPD)
