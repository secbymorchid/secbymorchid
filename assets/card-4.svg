<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 180" width="590" height="180">
  <defs>
    <linearGradient id="cardLeather4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
  </defs>

  <!-- Panel Base -->
  <rect x="2" y="2" width="586" height="176" rx="8" fill="url(#cardLeather4)" stroke="#3A2619" stroke-width="1.4"/>
  <rect x="6" y="6" width="578" height="168" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>

  <!-- Top Accent Bar: Warm Cognac -->
  <line x1="24" y1="2" x2="84" y2="2" stroke="#D97706" stroke-width="2.5"/>

  <!-- Header Row: Roman Numeral IV -->
  <text x="24" y="30" font-family="Georgia, Cambria, serif" font-size="13" font-weight="700" fill="#D4AF37">IV.</text>
  <text x="566" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#877668" text-anchor="end">inspect artifact &#8599;</text>

  <!-- Title -->
  <text x="24" y="56" font-family="Georgia, Cambria, serif" font-size="16" font-weight="700" fill="#F7EFE6">Multi-Threaded Network Port &amp; Service Auditor</text>

  <!-- Subtitle / Governance Objective -->
  <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#D97706">GOVERNANCE: ISO 27001 A.8.8 / A.8.9 &#183; ATTACK SURFACE DISCOVERY</text>

  <!-- Description -->
  <text x="24" y="98" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#A89687">
    <tspan x="24" dy="0">High-concurrency Python scanner utilizing socket, threading, and queue</tspan>
    <tspan x="24" dy="18">primitives with banner grabbing for automated service asset discovery.</tspan>
  </text>

  <!-- Tech Chips -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="70" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="35" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Python 3</text>

    <rect x="78" y="0" width="64" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="110" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Sockets</text>

    <rect x="150" y="0" width="78" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="189" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Threading</text>

    <rect x="236" y="0" width="58" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="265" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Recon</text>

    <rect x="302" y="0" width="104" height="22" rx="3" fill="#150E09" stroke="#D97706" stroke-width="1"/>
    <text x="354" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">Asset Audit</text>
  </g>
</svg>