<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="pCardLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
  </defs>

  <!-- Pillar 1: GRC -->
  <g transform="translate(15, 5)">
    <rect x="0" y="0" width="375" height="250" rx="8" fill="url(#pCardLeather)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="367" height="242" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#D4AF37" stroke-width="2.5"/>

    <text x="20" y="30" font-family="Georgia, Cambria, serif" font-size="11" font-weight="700" fill="#D4AF37">PILLAR 01</text>
    <text x="20" y="52" font-family="Georgia, Cambria, serif" font-size="15" font-weight="700" fill="#F7EFE6">Risk &amp; Governance (GRC)</text>

    <g transform="translate(20, 76)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#A89687">
      <text x="0" y="0">&#8226; Information Systems Governance &amp; Strategy</text>
      <text x="0" y="24">&#8226; Cyber Risk Assessment (ISO 27005 / EBIOS RM)</text>
      <text x="0" y="48">&#8226; ISO/IEC 27001 &amp; NIST CSF Frameworks</text>
      <text x="0" y="72">&#8226; Compliance Auditing &amp; Security Policies (PSSI)</text>
      <text x="0" y="96">&#8226; Data Protection &amp; Regulatory Alignment</text>
    </g>

    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="76" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="38" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#D4AF37" text-anchor="middle">ISO 27001</text>
      <rect x="84" y="0" width="74" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="121" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#D4AF37" text-anchor="middle">EBIOS RM</text>
      <rect x="166" y="0" width="56" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="194" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#D4AF37" text-anchor="middle">RGPD</text>
      <rect x="230" y="0" width="48" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="254" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#D4AF37" text-anchor="middle">GRC</text>
    </g>
  </g>

  <!-- Pillar 2: MGSI and Project Management -->
  <g transform="translate(412, 5)">
    <rect x="0" y="0" width="375" height="250" rx="8" fill="url(#pCardLeather)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="367" height="242" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#C5A059" stroke-width="2.5"/>

    <text x="20" y="30" font-family="Georgia, Cambria, serif" font-size="11" font-weight="700" fill="#C5A059">PILLAR 02</text>
    <text x="20" y="52" font-family="Georgia, Cambria, serif" font-size="15" font-weight="700" fill="#F7EFE6">IT &amp; Cyber Project Management</text>

    <g transform="translate(20, 76)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#A89687">
      <text x="0" y="0">&#8226; IS Urbanization &amp; Enterprise Architecture</text>
      <text x="0" y="24">&#8226; Conceptual &amp; Logical Modeling (UML, Merise)</text>
      <text x="0" y="48">&#8226; CASE Tools: SAP PowerDesigner &amp; StarUML</text>
      <text x="0" y="72">&#8226; Agile / Scrum Delivery &amp; Sprint Planning</text>
      <text x="0" y="96">&#8226; Scope, Gantt Schedules &amp; Risk Registers</text>
    </g>

    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="80" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="40" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#E6CA65" text-anchor="middle">Agile/Scrum</text>
      <rect x="88" y="0" width="58" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="117" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#E6CA65" text-anchor="middle">Merise</text>
      <rect x="154" y="0" width="48" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="178" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#E6CA65" text-anchor="middle">UML</text>
      <rect x="210" y="0" width="108" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="264" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#E6CA65" text-anchor="middle">PowerDesigner</text>
    </g>
  </g>

  <!-- Pillar 3: SecOps -->
  <g transform="translate(810, 5)">
    <rect x="0" y="0" width="375" height="250" rx="8" fill="url(#pCardLeather)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="367" height="242" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#10B981" stroke-width="2.5"/>

    <text x="20" y="30" font-family="Georgia, Cambria, serif" font-size="11" font-weight="700" fill="#10B981">PILLAR 03</text>
    <text x="20" y="52" font-family="Georgia, Cambria, serif" font-size="15" font-weight="700" fill="#F7EFE6">SecOps &amp; Technical Controls</text>

    <g transform="translate(20, 76)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#A89687">
      <text x="0" y="0">&#8226; SOC Telemetry &amp; Log Ingestion Pipelines</text>
      <text x="0" y="24">&#8226; Linux Administration &amp; System Hardening</text>
      <text x="0" y="48">&#8226; Python &amp; Bash Security Automation</text>
      <text x="0" y="72">&#8226; Network Auditing &amp; Port Scanning</text>
      <text x="0" y="96">&#8226; Deception Systems (Cowrie Honeypots)</text>
    </g>

    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="56" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="28" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" text-anchor="middle">Linux</text>
      <rect x="64" y="0" width="60" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="94" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" text-anchor="middle">Python</text>
      <rect x="132" y="0" width="50" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="157" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" text-anchor="middle">Bash</text>
      <rect x="190" y="0" width="50" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="215" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" text-anchor="middle">SIEM</text>
      <rect x="248" y="0" width="98" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
      <text x="297" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" text-anchor="middle">MITRE ATT&amp;CK</text>
    </g>
  </g>
</svg>