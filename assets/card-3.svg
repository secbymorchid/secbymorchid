<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 180" width="590" height="180">
  <defs>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B28"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>
  <!-- Card base panel -->
  <rect x="2" y="2" width="586" height="176" rx="10" fill="url(#cardGrad3)" stroke="#1E293B" stroke-width="1.2"/>
  <!-- Top accent edge -->
  <line x1="24" y1="2" x2="80" y2="2" stroke="#F59E0B" stroke-width="2"/>

  <!-- Header row -->
  <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#F59E0B">03</text>
  <text x="566" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748B" text-anchor="end">view writeups ↗</text>

  <!-- Title -->
  <text x="24" y="56" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Red Phoenix CTF 2026 (1st Place Writeups)</text>

  <!-- Governance badge -->
  <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#F59E0B">ACCOLADE: 1ST PLACE CHAMPION (6,750 PTS) · 30 CHALLENGES</text>

  <!-- Description -->
  <text x="24" y="98" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">
    <tspan x="24" dy="0">Documented technical solutions across Reverse Engineering, Cryptography,</tspan>
    <tspan x="24" dy="18">Web Exploitation, Forensics, and OSINT from the national 2026 competition.</tspan>
  </text>

  <!-- Tech chips -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="86" height="22" rx="4" fill="#161F30" stroke="#78350F" stroke-width="1"/>
    <text x="43" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#F59E0B" text-anchor="middle">1st Place 🏆</text>

    <rect x="94" y="0" width="86" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="137" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Reverse-Eng</text>

    <rect x="188" y="0" width="56" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="216" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Crypto</text>

    <rect x="252" y="0" width="66" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="285" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Web-Sec</text>

    <rect x="326" y="0" width="70" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="361" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Forensics</text>
