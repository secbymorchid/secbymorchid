<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176">
  <defs>
    <linearGradient id="dossierLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
  </defs>

  <!-- Panel Base: Smoked Leather with Double Border -->
  <rect x="2" y="2" width="1196" height="172" rx="8" fill="url(#dossierLeather)" stroke="#3A2619" stroke-width="1.6"/>
  <rect x="6" y="6" width="1188" height="164" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>

  <!-- Brass Corner Accents -->
  <circle cx="16" cy="16" r="2.2" fill="#C5A059" opacity="0.6"/>
  <circle cx="1184" cy="16" r="2.2" fill="#C5A059" opacity="0.6"/>
  <circle cx="16" cy="160" r="2.2" fill="#C5A059" opacity="0.6"/>
  <circle cx="1184" cy="160" r="2.2" fill="#C5A059" opacity="0.6"/>

  <!-- Titlebar Header -->
  <rect x="7" y="7" width="1186" height="34" fill="#150E09"/>
  <line x1="7" y1="41" x2="1193" y2="41" stroke="#3A2619" stroke-width="1"/>

  <!-- Header Labels -->
  <g transform="translate(24, 20)">
    <polygon points="0,-4 5,0 0,4 -5,0" fill="#D4AF37"/>
    <text x="14" y="3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#D4AF37" letter-spacing="1.5px">EXECUTIVE SUMMARY &#183; PROFILE BRIEF</text>
  </g>
  <text x="1170" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#877668" text-anchor="end">ENSAO MGSI (&apos;27) &#183; IT &amp; CYBER PROJECT MANAGEMENT</text>

  <!-- Row 1: Profile & Background -->
  <g transform="translate(32, 68)">
    <rect x="0" y="-12" width="68" height="18" rx="2.5" fill="#1F150E" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="34" y="1" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#F5E5B8" text-anchor="middle">PROFILE</text>
    <text x="82" y="1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#F7EFE6">
      <tspan font-weight="600">Moad Morchid</tspan> &#8212; MGSI Engineering Student at ENSA Oujda. Bridging IT &amp; Cyber Project Management with technical defense.
    </text>
  </g>

  <!-- Row 2: Core Focus & Methodology -->
  <g transform="translate(32, 105)">
    <rect x="0" y="-12" width="68" height="18" rx="2.5" fill="#1F150E" stroke="#997A2E" stroke-width="0.8"/>
    <text x="34" y="1" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#E6CA65" text-anchor="middle">DOMAINS</text>
    <text x="82" y="1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#F7EFE6">
      <tspan font-weight="600">Risk &amp; Governance</tspan> (ISO 27001, EBIOS RM) &#183; <tspan font-weight="600">IS Architecture</tspan> (UML, Merise, PowerDesigner) &#183; <tspan font-weight="600">SecOps</tspan> (SIEM, Linux, Python/Bash).
    </text>
  </g>

  <!-- Row 3: Accolade & Track Record -->
  <g transform="translate(32, 142)">
    <rect x="0" y="-12" width="68" height="18" rx="2.5" fill="#1A1C12" stroke="#10B981" stroke-width="0.8"/>
    <text x="34" y="1" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="middle">HONORS</text>
    <text x="82" y="1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#F7EFE6">
      <tspan font-weight="600" fill="#F5E5B8">&#9733; 1st Place Champion &#8212; Red Phoenix CTF 2026</tspan> (6,750 pts across 30 national cybersecurity scenarios).
    </text>
