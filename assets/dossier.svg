<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270">
  <defs>
    <linearGradient id="dossierLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>

    <!-- Typing clip paths -->
    <clipPath id="dossierL1">
      <rect x="36" y="58" width="1120" height="24">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="0.3s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="dossierL3">
      <rect x="36" y="110" width="1120" height="24">
        <animate attributeName="width" from="0" to="1120" dur="1.0s" begin="1.6s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="dossierL5">
      <rect x="36" y="162" width="1120" height="24">
        <animate attributeName="width" from="0" to="1120" dur="1.0s" begin="3.2s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="dossierL7">
      <rect x="36" y="214" width="1120" height="24">
        <animate attributeName="width" from="0" to="1120" dur="1.0s" begin="4.8s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .cmd-clip { width: 1120px !important; }
      .fade-item { opacity: 1 !important; }
      .term-cursor { display: none !important; }
    }
  </style>

  <!-- Panel Base: Smoked Leather with Double Stitch -->
  <rect x="2" y="2" width="1196" height="266" rx="8" fill="url(#dossierLeather)" stroke="#3A2619" stroke-width="1.8"/>
  <rect x="6" y="6" width="1188" height="258" rx="6" fill="none" stroke="#24170F" stroke-width="1"/>

  <!-- Brass Corner Screws -->
  <circle cx="16" cy="16" r="2.5" fill="#C5A059" opacity="0.6"/>
  <circle cx="1184" cy="16" r="2.5" fill="#C5A059" opacity="0.6"/>
  <circle cx="16" cy="254" r="2.5" fill="#C5A059" opacity="0.6"/>
  <circle cx="1184" cy="254" r="2.5" fill="#C5A059" opacity="0.6"/>

  <!-- Titlebar Header -->
  <rect x="7" y="7" width="1186" height="34" fill="#150E09"/>
  <line x1="7" y1="41" x2="1193" y2="41" stroke="#3A2619" stroke-width="1"/>

  <!-- Header Stamps -->
  <g transform="translate(24, 20)">
    <rect x="0" y="-7" width="12" height="14" rx="2" fill="#D4AF37" opacity="0.2"/>
    <text x="6" y="4" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#E6CA65" text-anchor="middle">&#167;</text>
    <text x="22" y="3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#D4AF37" letter-spacing="1px">CONFIDENTIAL // BOARD OF DIRECTORS EXECUTIVE BRIEFING DOSSIER</text>
  </g>
  <text x="1170" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#877668" text-anchor="end">CLEARANCE: SOVEREIGN RISK &amp; GRC</text>

  <!-- Line 1: Officer Identification -->
  <g clip-path="url(#dossierL1)">
    <text x="36" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#D4AF37">[OFFICER]</tspan><tspan fill="#877668">  :: </tspan><tspan fill="#F7EFE6">Moad Morchid (// SECBYMORCHID)</tspan><tspan fill="#877668">  &#8212;  MGSI Engineering Student @ ENSA Oujda (&apos;27)</tspan></text>
  </g>
  <!-- Line 2: Output -->
  <text x="36" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#A89687" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.1s" fill="freeze"/>
    <tspan fill="#D4AF37">&gt;</tspan> Domain: IT &amp; Cyber Project Management &#183; Information Systems Urbanization &#183; Risk &amp; Governance
  </text>

  <!-- Line 3: Strategic Mandate -->
  <g clip-path="url(#dossierL3)">
    <text x="36" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#D4AF37">[MANDATE]</tspan><tspan fill="#877668">  :: </tspan><tspan fill="#F7EFE6">cat governance_charter.doc</tspan></text>
  </g>
  <!-- Line 4: Output -->
  <text x="36" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#A89687" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.6s" fill="freeze"/>
    <tspan fill="#D4AF37">&gt;</tspan> Translating C-Suite Governance (ISO 27001, RGPD Recital 49, EBIOS RM) into enforceably hardened technical controls.
  </text>

  <!-- Line 5: Tactical Honors -->
  <g clip-path="url(#dossierL5)">
    <text x="36" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#D4AF37">[ACCOLADE]</tspan><tspan fill="#877668"> :: </tspan><tspan fill="#F5E5B8">cat honors_and_championships.txt</tspan></text>
  </g>
  <!-- Line 6: Output -->
  <text x="36" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#E6CA65" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.2s" fill="freeze"/>
    <tspan fill="#D4AF37">&gt; &#9733; 1st Place Champion &#8212; Red Phoenix CTF 2026 (6,750 pts / 30 complex scenarios solved under pressure)</tspan>
  </text>

  <!-- Line 7: Strategic Artifacts -->
  <g clip-path="url(#dossierL7)">
    <text x="36" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#D4AF37">[CONTROLS]</tspan><tspan fill="#877668"> :: </tspan><tspan fill="#F7EFE6">ls -1 strategic_controls/</tspan></text>
  </g>
  <!-- Line 8: Output -->
  <text x="36" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#EDE1D3" opacity="0" xml:space="preserve">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="5.8s" fill="freeze"/>
    <tspan fill="#D4AF37">[I]</tspan> ssh-bruteforce-siem/  <tspan fill="#10B981">[II]</tspan> deception-honeypot/  <tspan fill="#D4AF37">[III]</tspan> rpctf2026-writeups/  <tspan fill="#D97706">[IV]</tspan> surface-auditor/  <tspan fill="#877668">[V]</tspan> securebank-lab[WIP]/
  </text>

  <!-- Warm Amber Terminal Cursor -->
  <rect class="term-cursor" x="900" y="238" width="8" height="15" fill="#D4AF37" opacity="0">
    <set attributeName="opacity" to="1" begin="6.2s"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.2s" repeatCount="indefinite"/>
  </rect>
</svg>