<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B28"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>

  <!-- Box 1 -->
  <g transform="translate(15, 5)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="url(#tGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#38BDF8" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#38BDF8">CERTIFICATION</text>
    <text x="16" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Google Cybersecurity</text>
    <text x="16" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">
      <tspan x="16" dy="0">SIEM management, SOC triage,</tspan>
      <tspan x="16" dy="18">incident playbooks, Linux &amp; SQL.</tspan>
    </text>
    <rect x="16" y="126" width="98" height="20" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="65" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#38BDF8" text-anchor="middle">SOC Workflows</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(310, 5)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="url(#tGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#10B981">NETWORKING</text>
    <text x="16" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Cisco Networking Academy</text>
    <text x="16" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">
      <tspan x="16" dy="0">Network protocols (TCP/IP),</tspan>
      <tspan x="16" dy="18">zoning, infrastructure defense.</tspan>
    </text>
    <rect x="16" y="126" width="112" height="20" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="72" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#10B981" text-anchor="middle">Network Security</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(605, 5)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="url(#tGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#F59E0B" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#F59E0B">HANDS-ON LABS</text>
    <text x="16" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">TryHackMe Pathways</text>
    <text x="16" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">
      <tspan x="16" dy="0">SOC Level 1 pathways, attack</tspan>
      <tspan x="16" dy="18">surface triage, detection rules.</tspan>
    </text>
    <rect x="16" y="126" width="94" height="20" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="63" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#F59E0B" text-anchor="middle">SOC Level 1</text>
  </g>

  <!-- Box 4 -->
  <g transform="translate(900, 5)">
    <rect x="0" y="0" width="285" height="170" rx="8" fill="url(#tGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#A855F7" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#A855F7">SYSTEMS RIGOR</text>
    <text x="16" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Linux &amp; Shell Labs</text>
    <text x="16" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">
      <tspan x="16" dy="0">OverTheWire Bandit solutions &amp;</tspan>
      <tspan x="16" dy="18">pwn.college Linux Luminarium.</tspan>
    </text>
