    <text x="64" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#F7EFE6" text-anchor="middle">SOC Level 1</text>
  </g>

  <!-- Box 4 -->
  <g transform="translate(900, 5)">
    <rect x="0" y="0" width="285" height="160" rx="8" fill="url(#tLeatherGrad)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="277" height="152" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#D97706" stroke-width="2"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#D97706">SYSTEMS</text>
    <text x="16" y="46" font-family="Georgia, Cambria, serif" font-size="13.5" font-weight="700" fill="#F7EFE6">Linux &amp; Shell Discipline</text>
    <text x="16" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#A89687">
      <tspan x="16" dy="0">System internals, shell automation,</tspan>
      <tspan x="16" dy="18">OverTheWire Bandit &amp; Linux Luminarium.</tspan>
    </text>
    <rect x="16" y="118" width="108" height="20" rx="3" fill="#150E09" stroke="#D97706" stroke-width="1"/>
    <text x="70" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#F59E0B" text-anchor="middle">Linux Internals</text>
