    <line x1="16" y1="0" x2="60" y2="0" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#10B981">NETWORKING</text>
    <text x="16" y="46" font-family="Georgia, Cambria, serif" font-size="13.5" font-weight="700" fill="#F7EFE6">Cisco Networking Academy</text>
    <text x="16" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#A89687">
      <tspan x="16" dy="0">Network protocols, TCP/IP fundamentals,</tspan>
      <tspan x="16" dy="18">infrastructure defense, and routing.</tspan>
    </text>
    <rect x="16" y="118" width="100" height="20" rx="3" fill="#150E09" stroke="#10B981" stroke-width="1"/>
    <text x="66" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#10B981" text-anchor="middle">Cisco NetAcad</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(605, 5)">
    <rect x="0" y="0" width="280" height="160" rx="8" fill="url(#tLeatherGrad)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="272" height="152" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#D4AF37">HANDS-ON LABS</text>
