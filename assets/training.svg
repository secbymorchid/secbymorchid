<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170">
  <defs>
    <linearGradient id="tLeatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
  </defs>

  <!-- Box 1 -->
  <g transform="translate(15, 5)">
    <rect x="0" y="0" width="280" height="160" rx="8" fill="url(#tLeatherGrad)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="272" height="152" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#D4AF37">PROFESSIONAL</text>
    <text x="16" y="46" font-family="Georgia, Cambria, serif" font-size="13.5" font-weight="700" fill="#F7EFE6">Google Cybersecurity</text>
    <text x="16" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#A89687">
      <tspan x="16" dy="0">SIEM triage, SOC incident response,</tspan>
      <tspan x="16" dy="18">Linux hardening, and SQL telemetry.</tspan>
    </text>
    <rect x="16" y="118" width="108" height="20" rx="3" fill="#150E09" stroke="#997A2E" stroke-width="1"/>
    <text x="70" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" fill="#E6CA65" text-anchor="middle">Google Certified</text>
  </g>

  <!-- Box 2 -->
