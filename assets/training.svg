<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <linearGradient id="tLeatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
  </defs>

  <!-- Box 1 -->
  <g transform="translate(15, 5)">
    <rect x="0" y="0" width="280" height="170" rx="8" fill="url(#tLeatherGrad)" stroke="#3A2619" stroke-width="1.3"/>
    <rect x="4" y="4" width="272" height="162" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>
    <line x1="16" y1="0" x2="60" y2="0" stroke="#D4AF37" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#D4AF37">CREDENTIAL I</text>
    <text x="16" y="48" font-family="Georgia, Cambria, serif" font-size="13.5" font-weight="700" fill="#F7EFE6">Google Cybersecurity</text>
    <text x="16" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#A89687">
      <tspan x="16" dy="0">SIEM management, SOC triage,</tspan>
      <tspan x="16" dy="18">incident playbooks, Linux &amp; SQL.</tspan>
    </text>
    <rect x="16" y="126" width="102" height="20" rx="3" fill="#150E09" stroke="#997A2E" stroke-width="1"/>
