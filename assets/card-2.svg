    <tspan x="24" dy="18">enriching MaxMind GeoIP2 and mapping attacker commands to MITRE ATT&amp;CK.</tspan>
  </text>

  <!-- Tech chips -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
