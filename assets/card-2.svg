<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 180" width="590" height="180">
  <defs>
    <linearGradient id="cardLeather2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
  </defs>

  <!-- Panel Base -->
  <rect x="2" y="2" width="586" height="176" rx="8" fill="url(#cardLeather2)" stroke="#3A2619" stroke-width="1.4"/>
  <rect x="6" y="6" width="578" height="168" rx="6" fill="none" stroke="#24170F" stroke-width="0.8"/>

  <!-- Top Accent Bar: Emerald Gold -->
  <line x1="24" y1="2" x2="84" y2="2" stroke="#10B981" stroke-width="2.5"/>

  <!-- Header Row: Roman Numeral II -->
  <text x="24" y="30" font-family="Georgia, Cambria, serif" font-size="13" font-weight="700" fill="#D4AF37">II.</text>
  <text x="566" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#877668" text-anchor="end">inspect artifact &#8599;</text>

  <!-- Title -->
  <text x="24" y="56" font-family="Georgia, Cambria, serif" font-size="16" font-weight="700" fill="#F7EFE6">Enterprise SSH Honeypot &amp; Deception Stack</text>

  <!-- Subtitle / Governance Objective -->
  <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#10B981">GOVERNANCE: RGPD RECITAL 49 &amp; ISO 27001 A.8.20 &#183; SOVEREIGN DEFENSE</text>

  <!-- Description -->
  <text x="24" y="98" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#A89687">
    <tspan x="24" dy="0">Multi-tier Cowrie honeypot stack ingesting live adversary brute-force traffic,</tspan>
    <tspan x="24" dy="18">enriching MaxMind GeoIP2 and mapping attacker commands to MITRE ATT&amp;CK.</tspan>
  </text>

  <!-- Tech Chips -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="62" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="31" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Cowrie</text>

    <rect x="70" y="0" width="60" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="100" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Docker</text>

    <rect x="138" y="0" width="106" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="191" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">MITRE ATT&amp;CK</text>

    <rect x="252" y="0" width="62" height="22" rx="3" fill="#150E09" stroke="#3A2619" stroke-width="1"/>
    <text x="283" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7EFE6" text-anchor="middle">Python</text>

    <rect x="322" y="0" width="68" height="22" rx="3" fill="#150E09" stroke="#10B981" stroke-width="1"/>
    <text x="356" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">RGPD 49</text>
  </g>
</svg>