<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 180" width="590" height="180">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B28"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>
  <!-- Card base panel -->
  <rect x="2" y="2" width="586" height="176" rx="10" fill="url(#cardGrad2)" stroke="#1E293B" stroke-width="1.2"/>
  <!-- Top accent edge -->
  <line x1="24" y1="2" x2="80" y2="2" stroke="#10B981" stroke-width="2"/>

  <!-- Header row -->
  <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#10B981">02</text>
  <text x="566" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748B" text-anchor="end">view repository ↗</text>

  <!-- Title -->
  <text x="24" y="56" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Enterprise SSH Honeypot &amp; Threat Intelligence</text>

  <!-- Governance badge -->
  <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#10B981">GOVERNANCE: RGPD RECITAL 49 &amp; ISO 27001 A.8.20 · DECEPTION</text>

  <!-- Description -->
  <text x="24" y="98" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">
