    <rect x="68" y="0" width="58" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="97" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Docker</text>

    <rect x="134" y="0" width="102" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="185" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">MITRE ATT&amp;CK</text>

    <rect x="244" y="0" width="60" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="274" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Python</text>

    <rect x="312" y="0" width="60" height="22" rx="4" fill="#161F30" stroke="#1E293B" stroke-width="1"/>
    <text x="342" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#10B981" text-anchor="middle">RGPD 49</text>
